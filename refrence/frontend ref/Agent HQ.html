<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent HQ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0F12;--s1:#171A20;--s2:#1e222a;--ln:#262b35;--ink:#e6e8ee;--mu:#8b93a3;--ac:#8b7cff;--ok:#4cc38a;--rw:52px;--iw:312px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 13px Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:grid;grid-template:"rail top top" 44px "rail stage insp" 1fr/var(--rw) 1fr var(--iw);transition:grid-template-columns .25s ease}
#app.wide{--rw:176px}#app.noi{--iw:0px}
#rail{grid-area:rail;background:var(--s1);border-right:1px solid var(--ln);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.lg0{height:28px;display:flex;align-items:center;gap:10px;padding-left:5px;margin-bottom:10px;font-weight:600;white-space:nowrap}
.lg0 i{width:18px;height:18px;border-radius:5px;background:var(--ac);flex:none}
.nv{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;height:32px;padding:0 7px;border-radius:7px;color:var(--mu);white-space:nowrap;cursor:pointer;transition:background .15s,color .15s}
.nv:hover{background:var(--s2);color:var(--ink)}.nv.on{background:var(--s2);color:var(--ink)}.nv:focus-visible,.b:focus-visible{outline:1px solid var(--ac)}
.nv svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sp1{flex:1}
#top{grid-area:top;background:var(--s1);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:8px;padding:0 12px}
#top .bc{color:var(--mu)}#top .bc b{color:var(--ink);font-weight:500}
.tag{border:1px solid var(--ln);border-radius:6px;padding:3px 8px;color:var(--mu);font-size:12px;display:flex;gap:6px;align-items:center}.tag b{color:var(--ink);font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.b{background:none;border:1px solid var(--ln);border-radius:6px;height:26px;min-width:26px;padding:0 8px;color:var(--mu);transition:.15s}.b:hover{background:var(--s2);color:var(--ink)}.b.on{background:var(--s2);color:var(--ink);border-color:#3a4150}
.b.p{background:var(--ac);border-color:var(--ac);color:#0D0F12;font-weight:500}.b.p:hover{filter:brightness(1.1);background:var(--ac)}
#stage{grid-area:stage;position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg);touch-action:none}
#world{width:100%;height:100%;display:block;cursor:grab}#world:active{cursor:grabbing}
#dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:rgba(23,26,32,.86);backdrop-filter:blur(8px);border:1px solid var(--ln);border-radius:9px;padding:4px;max-width:calc(100% - 16px);overflow-x:auto}
#dock .b{border:0;height:24px}#dock .v{width:1px;height:16px;background:var(--ln);margin:0 2px}#dock span{min-width:38px;text-align:center;color:var(--mu);font-size:12px}
#toast{position:absolute;top:12px;left:50%;transform:translate(-50%,-8px);background:var(--s1);border:1px solid var(--ln);border-radius:8px;padding:7px 12px;opacity:0;transition:.3s;pointer-events:none;display:flex;gap:8px;align-items:center}#toast.on{opacity:1;transform:translate(-50%,0)}
#insp{grid-area:insp;background:var(--s1);border-left:1px solid var(--ln);overflow:hidden;min-width:0}
#insp>div{width:312px;padding:16px;height:100%;overflow:auto}
.hd1{display:flex;gap:10px;align-items:center}.av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:600;color:#0D0F12}
.hd1 h2{font-size:14px;margin:0;font-weight:600}.hd1 small{color:var(--mu)}
.sec{margin-top:18px}.sec>h3{font-size:11px;font-weight:500;color:var(--mu);margin:0 0 8px;letter-spacing:.2px}
.live{display:flex;align-items:center;gap:7px;margin-top:14px;color:var(--ink)}.live em{margin-left:auto;font-style:normal;color:var(--ok);font-size:11px}
.pg{height:3px;background:var(--ln);border-radius:2px;margin-top:10px;overflow:hidden}.pg u{display:block;height:100%;background:var(--ac);transition:width .6s linear}
.row{display:flex;gap:6px;margin-top:14px;position:relative}.row .b{flex:1;height:30px}
#pick{display:none;margin-top:6px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);padding:4px}#pick.on{display:block}
#pick button{all:unset;box-sizing:border-box;display:block;width:100%;padding:7px 8px;border-radius:5px;cursor:pointer;color:var(--mu)}#pick button:hover{background:var(--s2);color:var(--ink)}
.tl{position:relative;padding-left:16px;margin:0;list-style:none}.tl:before{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:1px;background:var(--ln)}
.tl li{position:relative;padding:4px 0;color:var(--mu);display:flex;gap:10px}.tl li:before{content:"";position:absolute;left:-16px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--s1);border:1px solid #3a4150}.tl li:first-child:before{background:var(--ac);border-color:var(--ac)}
.tl time{color:#5f6779;font-variant-numeric:tabular-nums;flex:none}.tl li:first-child{color:var(--ink)}
.ach{display:flex;flex-direction:column;gap:6px;color:var(--mu)}.ach div{display:flex;gap:8px;align-items:center}.ach i{width:5px;height:5px;background:var(--ac);transform:rotate(45deg)}
.agent{cursor:pointer;outline:none}.ring{opacity:0;transition:opacity .2s}.agent:hover .ring,.agent.sel .ring{opacity:.9}.agent.done .ring{stroke:#4cc38a!important;animation:fl 1.4s ease-out}
@keyframes fl{0%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.8)}}.ring{transform-box:fill-box;transform-origin:center}
.lbl{transition:opacity .2s}.nolbl .lbl{opacity:0}.nolbl .agent:hover .lbl{opacity:1}
#paths{opacity:0;transition:opacity .3s}.showp #paths{opacity:1}
.sp *{transform-box:fill-box}
.walk .lL{animation:sw .45s infinite alternate}.walk .lR{animation:sw .45s infinite alternate-reverse}.walk .aL{animation:sa .45s infinite alternate;transform-origin:50% 0}.walk .aR{animation:sa .45s infinite alternate-reverse;transform-origin:50% 0}
@keyframes sw{from{transform:translateY(-1.6px)}to{transform:translateY(1.6px)}}@keyframes sa{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.type .aL{animation:ty .26s infinite alternate}.type .aR{animation:ty .26s .13s infinite alternate}@keyframes ty{to{transform:translateY(-1.8px)}}
.coffee .aR{transform-origin:50% 0;animation:cf 6s ease-in-out infinite}@keyframes cf{0%,12%{transform:rotate(0)}25%,70%{transform:rotate(150deg)}85%,100%{transform:rotate(0)}}
.idle .tor,.coffee .tor,.type .hd{animation:br 3.4s ease-in-out infinite;transform-origin:50% 100%}@keyframes br{50%{transform:scaleY(1.035)}}
.u .eyes{display:none}.hb{opacity:0}.u .hb{opacity:1}.seat .lg{display:none}
.ln{transform-box:fill-box;transform-origin:left;animation:ln 3.2s ease-in-out infinite}@keyframes ln{0%,100%{transform:scaleX(.35)}50%{transform:scaleX(1)}}
.stm{opacity:0;animation:stm 2.4s ease-in infinite}@keyframes stm{0%{opacity:0;transform:translateY(2px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-8px)}}
@media(max-width:820px){#app{--iw:0px;--rw:44px}#app.wide{--rw:44px}.nv span{display:none}}
@media(prefers-reduced-motion:reduce){.sp *,.ln,.stm{animation:none!important}}
</style></head><body>

<nav id="rail"><div class="lg0"><i></i><span>Agent HQ</span></div>

<button class="b" data-sp="0">Pause</button><button class="b" data-sp=".5">0.5×</button><button class="b on" data-sp="1">1×</button><button class="b" data-sp="2">2×</button><i class="v"></i>

</div>
